<!DOCTYPE html>
<html>
<head>
    <style>
        #ammo-container {
            position: absolute;
            bottom: 995px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-right: 4px solid #ff0000;
            padding: 4px 14px;
            border-radius: 1px;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: none; /* Hidden by default */
        }
        .count { font-size: 20px; font-weight: bold; }
        .separator { color: #ff0000; margin: 0 5px; }
    </style>
</head>
<body>
<div id="ammo-container">
    <span id="clip" class="count">0</span>
    <span id="sep" class="separator">/</span>
    <span id="total" class="count">0</span>
</div>

<script>
    const container = document.getElementById('ammo-container');
    const clip = document.getElementById('clip');
    const sep = document.getElementById('sep');
    const total = document.getElementById('total');

    window.addEventListener('message', (event) => {
        const data = event.data;

        if (!data.show) {
            container.style.display = 'none';
            return;
        }

        container.style.display = 'block';
        // throwables: show only the count, no clip or separator
        clip.style.display = sep.style.display = data.throwable ? 'none' : '';
        clip.innerText = data.clip;
        total.innerText = data.total;
    });
</script>
